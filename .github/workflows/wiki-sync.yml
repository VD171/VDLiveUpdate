# wiki/ is the source of truth. This assembles the published pages from it and copies them into
# the separate VDLiveUpdate.wiki.git. Runs on every push to main; the "no change -> no commit"
# guard keeps it a no-op when wiki/ did not change. Initialize the Wiki once (create any page in
# the web UI) before the first run, or the wiki clone has no repo to pull.

name: Wiki sync

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: wiki-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Assemble wiki/ and sync into the Wiki
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" wiki-clone
          bash .github/scripts/gen_wiki.sh wiki wiki-clone
          cd wiki-clone
          git add -A
          if git diff --cached --quiet; then
            echo "wiki already up to date"
          else
            git commit -m "wiki: sync @ ${GITHUB_SHA}"
            git push
          fi
